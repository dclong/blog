[project]
name = "blog"
version = "0.1.0"
description = "Ben Du's personal blog."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "loguru>=0.7.3",
    "pelican>=4.11.0",
    "pelican-jupyter>=0.10.1",
    "pyyaml>=6.0.2",
    "tqdm>=4.67.1",
]

[tool.deptry]
ignore_notebooks = true
extend_exclude = ["themes/"]

[dependency-groups]
dev = [
    "deptry>=0.24.0",
    "pytest>=8.3.5",
    "ruff>=0.11.8",
    "ty>=0.0.8",
]

[tool.ruff.lint]
exclude = [
    "themes/",
    "**/*.ipynb",
]

[tool.ty.src]
exclude = [
    "**/*.ipynb",
]
